<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Viewer</title>
  <meta name="description" content="See how any website looks on popular phone screens.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="6" y="2" width="12" height="20" rx="3"/>
        <line x1="10.5" y1="18.5" x2="13.5" y2="18.5"/>
      </svg>
      Phone Viewer
    </div>

    <form id="url-form" class="url-form">
      <input id="url-input" type="text" inputmode="url" autocomplete="url" spellcheck="false"
             placeholder="Type a website, e.g. mystore.myshopify.com" aria-label="Website address">
      <button type="submit" class="primary">Show it</button>
    </form>

    <div class="controls">
      <label class="sr-only" for="device-select">Phone</label>
      <select id="device-select" aria-label="Phone"></select>

      <div id="custom-size" class="custom-size" hidden>
        <input id="custom-width" type="number" min="200" max="1600" value="400" aria-label="Width">
        <span>×</span>
        <input id="custom-height" type="number" min="300" max="2000" value="860" aria-label="Height">
      </div>

      <button id="rotate-btn" type="button" title="Turn the phone sideways">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="11" height="13" rx="2"/><path d="M11 3a9 9 0 0 1 9 9"/><path d="M21 8v4h-4"/></svg>
        Rotate
      </button>
      <button id="reload-btn" type="button" title="Load the page again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        Reload
      </button>
    </div>
  </header>

  <main id="stage" class="stage">
    <div id="notes-layer" class="notes-layer"></div>
    <p id="notes-hint" class="notes-hint">Click anywhere to add a note. Drag the bar above the phone to move it.</p>

    <div id="phone-holder" class="phone-holder">
      <div id="phone-handle" class="phone-handle" title="Drag to move the phone. Double-click to center it.">
        <svg viewBox="0 0 16 10" aria-hidden="true"><circle cx="3" cy="2.5" r="1.5"/><circle cx="8" cy="2.5" r="1.5"/><circle cx="13" cy="2.5" r="1.5"/><circle cx="3" cy="7.5" r="1.5"/><circle cx="8" cy="7.5" r="1.5"/><circle cx="13" cy="7.5" r="1.5"/></svg>
      </div>
      <div id="phone" class="phone">
        <div class="screen" id="screen">
          <div class="status-bar" id="status-bar">
            <span class="clock">9:41</span>
            <span class="icons" aria-hidden="true">
              <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
              <svg viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2.5" y="2.5" width="18" height="8" rx="2"/><rect x="24" y="4.5" width="2" height="4" rx="1" opacity="0.4"/></svg>
            </span>
          </div>
          <div class="cutout" id="cutout"></div>
          <iframe id="site-frame" title="Website preview"
                  sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
          <div class="empty" id="empty-msg">
            <p>Type a website above and press <b>Show it</b></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="info">
    <span id="device-info"></span>
    <span class="info-right">
      <button id="clear-notes" type="button" class="link-btn" hidden>Clear notes</button>
      <span id="mode-badge" class="badge"></span>
    </span>
  </footer>

  <script src="devices.js"></script>
  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
